# 最低限のCI：PRのたびに「壊れていないか」を自動チェックします。
# 技術スタックが決まる前でも動くよう、リポジトリ直下にあるファイルを見て
# 必要なチェックだけ実行します（package.json があれば Node.js、など）。
# スタックが決まったら AI に「ci.yml をこの構成に合わせて書き直して」と頼んでください。
# フロントとバックをフォルダで分ける場合も、書き直しが必要です。

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- 安全チェック：.env がコミットされていないか ----
      - name: .env がコミットされていないか確認
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::.env ファイルがコミットされています。削除して、中のAPIキーは再発行してください。"
            exit 1
          fi

      # ---- Node.js（package.json がある場合）----
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: hashFiles('package.json') != ''
        name: Node.js：インストール・lint・build・test
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm run build --if-present
          npm test --if-present

      # ---- Python（requirements.txt か pyproject.toml がある場合）----
      - if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        name: Python：インストール・lint・test
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          pip install ruff pytest
          ruff check .
          # テストが1つもない場合（終了コード5）は成功扱い
          pytest || [ $? -eq 5 ]

      # ---- Go（go.mod がある場合）----
      - if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: hashFiles('go.mod') != ''
        name: Go：vet・build・test
        run: |
          go vet ./...
          go build ./...
          go test ./...

      # ---- Flutter（pubspec.yaml がある場合）----
      - if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: hashFiles('pubspec.yaml') != ''
        name: Flutter：analyze・test
        run: |
          flutter pub get
          flutter analyze
          if [ -d test ]; then flutter test; fi
