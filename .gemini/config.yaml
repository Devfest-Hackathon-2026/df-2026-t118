# Gemini Code Assist（GitHub のPRレビュー）の設定
have_fun: false
code_review:
  disable: false
  # LOW / MEDIUM / HIGH / CRITICAL。初心者の学びのため MEDIUM 以上を表示
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
ignore_patterns: []
